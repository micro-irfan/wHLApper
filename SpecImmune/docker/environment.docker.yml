name: SpecImmune
# Docker-friendly version of SpecImmune's environment.yml.
# - Only conda-forge + bioconda (no Anaconda 'defaults' channel)
# - Top-level packages only, no build strings; the solver fills in libraries
#   (libgcc, openblas, X11, Qt, aws-*, etc.) so they're mutually compatible.
# - Versions of the main analysis tools are kept as in the original file.
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python and scientific stack
  - python=3.8
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-learn=1.3.0
  - statsmodels=0.14.1
  - matplotlib=3.7.3
  - seaborn=0.13.2
  - networkx=3.1
  - biopython=1.83
  - pyfaidx
  - pyvcf3
  - pyyaml
  - pulp=2.8.0
  - coincbc
  - pyarrow
  - dask
  - bokeh
  - pypdf2
  - pdfcombine
  - requests
  - xopen
  - nomkl

  # Alignment, variant calling and phasing
  - minimap2=2.30
  - mappy=2.28
  - bwa=0.7.19
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - longshot=1.0.0
  - sniffles=2.2
  - whatshap=2.3
  - pbsv=2.9.0
  - pbtk
  - blast            # original pinned 2.5.0; the paper used blastn 2.15
  - stringtie=2.2.3
  - picard
  - seqtk

  # Assembly
  - hifiasm
  - flye
  - canu

  # Utilities
  - jq
  - k8
  - entrez-direct
  - gnuplot
  - pigz
  - wget
  - r-base
  - r-rsvg
  - pip

  - pip:
      - bwapy==0.1.4
      - cigar==0.1.3
      - cutesv==2.1.2
      - cython==3.0.12
      # dysgu 1.6.2 pins pysam==0.21.0, which conflicts with truvari (pysam>=0.22).
      # Install dysgu after env create: pip install --no-deps dysgu==1.6.2
      - edlib==1.3.9.post1
      - genomeview==1.1.4
      - intervaltree==3.1.0
      - lightgbm==4.6.0
      - markdown-it-py==3.0.0
      - mdurl==0.1.2
      - pyabpoa==1.5.3
      - pybigwig==0.3.22
      - pysam==0.23.0
      - pytabix==0.1
      - pywfa==0.5.1
      - rich==14.0.0
      - truvari==5.2.0
      - xlrd==2.0.1
